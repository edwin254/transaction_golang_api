version: "3.9"
services:
  api:
      build: .
      container_name: gapstack_api
      volumes:
        - .:/app
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - gapstack-net
      ports:
        - "8080:8080"
      env_file:
        - ./app.env
  postgres:
    image: postgres:latest
    container_name: gapstack-postgres
    hostname: gapstack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - gapstack-net
    env_file:
      - ./app.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db:
networks:
  gapstack-net:
    driver: bridge